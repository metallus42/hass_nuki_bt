name: "Release"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: "ZIP the integration directory"
        shell: "bash"
        run: python3 scripts/build_release.py "$RUNNER_TEMP/hass_nuki_bt.zip"

      - name: "Validate the installable ZIP"
        run: python3 scripts/validate_release.py "$RUNNER_TEMP/hass_nuki_bt.zip" --expected-version "$RELEASE_TAG"

      - name: "Test the published archive in Home Assistant's complete runtime"
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            -v "$RUNNER_TEMP/hass_nuki_bt.zip:/tmp/hass_nuki_bt.zip:ro" \
            ghcr.io/home-assistant/home-assistant:2026.9.3 \
            -c 'python -m pip install --disable-pip-version-check pyNukiBT==0.0.20 async-timeout==5.0.1 && python scripts/test_release.py /tmp/hass_nuki_bt.zip'

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ runner.temp }}/hass_nuki_bt.zip
