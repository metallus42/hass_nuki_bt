name: "Release"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: "Adjust version number"
        shell: "bash"
        run: |
          yq -i -o json '.version = strenv(RELEASE_TAG)' \
            "${{ github.workspace }}/custom_components/hass_nuki_bt/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/hass_nuki_bt"
          zip hass_nuki_bt.zip -r ./

      - name: "Validate the installable ZIP"
        run: python3 scripts/validate_release.py custom_components/hass_nuki_bt/hass_nuki_bt.zip

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ github.workspace }}/custom_components/hass_nuki_bt/hass_nuki_bt.zip
