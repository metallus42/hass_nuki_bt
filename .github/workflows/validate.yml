name: "Validate"

on:
  workflow_dispatch:
#  schedule:
#    - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  regression-tests:
    name: "Nuki protocol and action regressions"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"

      - name: "Run regression tests in Home Assistant's complete runtime"
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            ghcr.io/home-assistant/home-assistant:2026.9.3 \
            -c 'python -m pip install --disable-pip-version-check pyNukiBT==0.0.20 async-timeout==5.0.1 && python scripts/build_release.py /tmp/hass_nuki_bt.zip && python scripts/test_release.py /tmp/hass_nuki_bt.zip'

  release-package:
    name: "Release package validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"

      - name: "Build the installable ZIP"
        run: python3 scripts/build_release.py "$RUNNER_TEMP/hass_nuki_bt.zip"

      - name: "Validate the installable ZIP"
        run: python3 scripts/validate_release.py "$RUNNER_TEMP/hass_nuki_bt.zip"

  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.0"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.0"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"
            # Remove this 'ignore' key when you have added brand images for your integration to https://github.com/home-assistant/brands
            ignore: "brands"
