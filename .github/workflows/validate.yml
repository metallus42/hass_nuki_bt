name: "Validate"

on:
  workflow_dispatch:
#  schedule:
#    - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  regression-tests:
    name: "Nuki protocol and action regressions"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"

      - name: "Set up Python"
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: "Install the tested Home Assistant and protocol versions"
        run: |
          python -m pip install homeassistant==2026.9.3 pyNukiBT==0.0.20 async-timeout==5.0.1
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import homeassistant

          components = Path(homeassistant.__file__).parent / "components"
          requirements = []
          pending = ["bluetooth_adapters"]
          seen = set()
          while pending:
              name = pending.pop()
              if name in seen:
                  continue
              seen.add(name)
              manifest = json.loads((components / name / "manifest.json").read_text())
              pending.extend(manifest.get("dependencies", []))
              requirements.extend(manifest.get("requirements", []))
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY

      - name: "Run regression tests"
        run: python -m unittest discover -s tests -v

  release-package:
    name: "Release package validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"

      - name: "Build the installable ZIP"
        working-directory: custom_components/hass_nuki_bt
        run: zip -r "$RUNNER_TEMP/hass_nuki_bt.zip" .

      - name: "Validate the installable ZIP"
        run: python3 scripts/validate_release.py "$RUNNER_TEMP/hass_nuki_bt.zip"

  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.0"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.0"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"
            # Remove this 'ignore' key when you have added brand images for your integration to https://github.com/home-assistant/brands
            ignore: "brands"
